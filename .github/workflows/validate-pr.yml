name: Validate Anarosa pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: npm run lint:js
      - name: Run public build tests
        run: npm run test:public
      - name: Check Supabase Edge Function TypeScript
        run: npm run check
      - name: Run Edge Function tests
        run: npm run test
